name: Commit convention

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate-commits:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate pull request commits
        if: github.event_name == 'pull_request'
        run: >-
          node .orchestrator/bin/git-checkpoint.mjs validate-range
          "${{ github.event.pull_request.base.sha }}"
          "${{ github.event.pull_request.head.sha }}"

      - name: Validate pushed commits
        if: github.event_name == 'push'
        run: >-
          node .orchestrator/bin/git-checkpoint.mjs validate-range
          "${{ github.event.before }}"
          "${{ github.sha }}"

      - name: Verify orchestrator contracts
        run: node .orchestrator/bin/orchestrator.mjs verify-system
